<!-- Google tag: si attiva solo dopo il consenso (banner cookie) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  (function(){
    var KEY='ic_consenso_cookie';
    function getC(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
    function setC(v){try{localStorage.setItem(KEY,v);}catch(e){}}
    function loadGA(){
      if(window.__icGA) return; window.__icGA=true;
      var s=document.createElement('script'); s.async=true;
      s.src='https://www.googletagmanager.com/gtag/js?id=G-M2CGSNEM9B';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-M2CGSNEM9B');
    }
    function banner(){
      if(document.getElementById('ic-cookie-banner')) return;
      var b=document.createElement('div'); b.id='ic-cookie-banner';
      b.setAttribute('role','dialog'); b.setAttribute('aria-label','Consenso ai cookie');
      b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;max-width:640px;margin:0 auto;background:#1b1e22;color:#efe9da;border-radius:10px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-family:Inter,Arial,sans-serif;font-size:14px;line-height:1.5;';
      b.innerHTML='<div style="margin-bottom:12px;">Usiamo Google Analytics per contare le visite in forma anonima e migliorare il sito. Questi cookie si attivano solo se accetti. Puoi cambiare idea quando vuoi dal link «Cookie» in fondo alla pagina.</div>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">'+
        '<button type="button" id="ic-cookie-no" style="cursor:pointer;padding:8px 16px;border-radius:6px;border:1px solid #c7bc9f;background:transparent;color:#efe9da;font:inherit;font-weight:600;">Rifiuta</button>'+
        '<button type="button" id="ic-cookie-si" style="cursor:pointer;padding:8px 16px;border-radius:6px;border:1px solid #a97a1f;background:#a97a1f;color:#fff;font:inherit;font-weight:600;">Accetta</button></div>';
      document.body.appendChild(b);
      document.getElementById('ic-cookie-si').onclick=function(){setC('si');b.remove();loadGA();};
      document.getElementById('ic-cookie-no').onclick=function(){setC('no');b.remove();};
    }
    function link(){
      if(document.getElementById('ic-cookie-link')) return;
      var a=document.createElement('a'); a.id='ic-cookie-link'; a.href='#'; a.textContent='Cookie';
      a.style.cssText='display:block;text-align:center;margin:18px auto 24px;font-family:Inter,Arial,sans-serif;font-size:12px;color:#565c64;text-decoration:underline;';
      a.onclick=function(e){e.preventDefault();banner();};
      document.body.appendChild(a);
    }
    if(getC()==='si') loadGA();
    document.addEventListener('DOMContentLoaded',function(){ if(!getC()) banner(); link(); });
  })();
</script>

<style>

  *{box-sizing:border-box;}

  .masthead{

    box-shadow: var(--shadow-lg);
  }
  .masthead::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:6px;
    background:linear-gradient(90deg, var(--red-deep), var(--red) 40%, var(--gold) 70%, var(--navy) 100%);
  }
  .masthead-top{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#a8a196;
    margin-bottom:14px;
  }
  .masthead-title{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(32px,7vw,56px);
    line-height:.95;
    margin:0;
  }
  .masthead-title em{
    font-style:italic;
    font-weight:400;
    color:var(--red);
  }
  .masthead-sub{
    font-size:15.5px;
    color:#9aa0aa;
    margin-top:10px;
    max-width:600px;
    line-height:1.5;
  }
  .back-link{
    display:inline-block;
    margin-top:14px;
    color:#e9e4d6;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    text-decoration:none;
    border-bottom:1px solid #565c64;
    padding-bottom:2px;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:36px 6vw 0 6vw;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(165deg, #ffffff 0%, var(--card) 60%);
    border-radius:10px;
    padding:18px 22px;
    box-shadow: var(--shadow-md);
    text-decoration:none;
    color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .entry:hover{
    transform:translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .entry-date{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
  }
  .entry-arrow{
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    font-size:14px;
  }
  @media (max-width:640px){
    .masthead{ padding:22px 5vw 18px 5vw; }
    .masthead-title{ font-size:38px; }
    .masthead-sub{ font-size:14px; }
    .wrap{ padding:24px 5vw 0 5vw; }
    .entry{ padding:14px 16px; }
    .entry-date{ font-size:16px; }
  }
</style>
